services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: minirag
      POSTGRES_PASSWORD: minirag
      POSTGRES_DB: minirag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql

volumes:
  postgres_data:
