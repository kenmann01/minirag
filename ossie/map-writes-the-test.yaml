# Apache Ossie 0.1.1 semantic model for the map and the corpus contract.
# vendor_name is restricted by the schema, so minirag and graphify live in the
# COMMON extension payload. Every source below is a public-schema table that
# `python -m app ossie validate` can prove exists in the live database:
# policy_chunks and sections come from ingest, graph_nodes and graph_edges
# from `ossie materialize`, and runs, task_results, tool_calls, gate_metrics
# from the score and gate writers.

version: "0.1.1"

semantic_model:
  - name: map_writes_the_test
    description: >
      Plug-and-play contract for a repository map and a swappable industry corpus.
      The agent reads the map before it explores, and grounds domain answers in
      retrieved chunk ids.
    ai_context:
      instructions: >
        Read the map before exploring the repository. Use graph nodes and edges
        for structural questions. Ground domain answers in retrieved chunk ids
        from the corpus, and cite those ids. Swap the corpus by replacing the
        folder and re-ingesting. Do not present a whole-repository diagram.
      synonyms:
        - "the map"
        - "the corpus"
      examples:
        - "Which file does this loan method call?"
        - "Which retrieved rule limits this practice?"
    datasets:
      - name: retrieved_chunks
        source: minirag.public.policy_chunks
        primary_key: [chunk_id]
        description: Child windows stored by ingest. The text column is the child window; parent_text is the whole section.
        ai_context:
          instructions: Cite chunk_id when a domain answer depends on this row.
        fields:
          - name: chunk_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: chunk_id
            description: Stable child-window identity.
          - name: source_doc
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: source_doc
          - name: section
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: section
            description: Numbered section within the document.
          - name: section_title
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: section_title
          - name: effective_date
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: effective_date
          - name: superseded_by
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: superseded_by
          - name: parent_text
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: parent_text
            description: Whole parent section body returned for generation.
          - name: text
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: text
            description: Child window used for retrieval.
      - name: sections
        source: minirag.public.sections
        primary_key: [source_doc, section]
        description: One row per numbered parent section, written by ingest alongside the chunks.
        fields:
          - name: source_doc
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: source_doc
          - name: section
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: section
          - name: section_title
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: section_title
          - name: parent_text
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: parent_text
          - name: effective_date
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: effective_date
          - name: superseded_by
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: superseded_by
      - name: graph_nodes
        source: minirag.public.graph_nodes
        primary_key: [node_id]
        description: Files, classes, and functions from the repository map, written by ossie materialize.
        fields:
          - name: node_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: node_id
          - name: label
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: label
          - name: source_file
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: source_file
      - name: graph_edges
        source: minirag.public.graph_edges
        primary_key: [source_id, target_id, relation]
        description: Imports, calls, and uses. Tier 1 checks use EXTRACTED edges only.
        fields:
          - name: source_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: source_id
          - name: target_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: target_id
          - name: relation
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: relation
          - name: confidence
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: confidence
      - name: runs
        source: minirag.public.runs
        primary_key: [run_id, context]
        description: One row per scored context arm, written by the score run.
        fields:
          - name: run_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: run_id
          - name: context
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: context
          - name: created_at
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: created_at
          - name: tasks_total
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: tasks_total
          - name: tasks_passed
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: tasks_passed
          - name: passed_tier1
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: passed_tier1
          - name: passed_tier2
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: passed_tier2
          - name: tool_calls
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: tool_calls
          - name: cost_usd
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: cost_usd
      - name: task_results
        source: minirag.public.task_results
        primary_key: [run_id, context, task_id]
        description: One row per scored task case with its tier, pass flag, and origin.
        fields:
          - name: run_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: run_id
          - name: context
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: context
          - name: task_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: task_id
          - name: tier
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: tier
          - name: passed
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: passed
          - name: origin
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: origin
          - name: created_at
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: created_at
      - name: tool_calls
        source: minirag.public.tool_calls
        primary_key: [run_id, context, task_id]
        description: Per task tool-call counts, reconciled with the runs row.
        fields:
          - name: run_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: run_id
          - name: context
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: context
          - name: task_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: task_id
          - name: tool_calls
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: tool_calls
          - name: created_at
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: created_at
      - name: gate_metrics
        source: minirag.public.gate_metrics
        primary_key: [run_id]
        description: >
          One row per repository gate run with the five scale numbers and the
          full gate document. Re-runs append rows, so history accumulates.
          Written by the gate metrics writer.
        fields:
          - name: run_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: run_id
          - name: gate
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: gate
            description: >
              The full gate document: scope, largest mermaid info, errors,
              loans coverage, and graph path.
          - name: wall_time_seconds
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: wall_time_seconds
            description: Seconds spent mapping the repository.
          - name: node_count
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: node_count
            description: Nodes in the extracted repository graph.
          - name: edge_count
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: edge_count
            description: Edges in the extracted repository graph.
          - name: passed
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: passed
            description: True when the run produced a graph, the gate exit-zero signal.
          - name: created_at
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: created_at
    relationships:
      - name: chunk_section
        from: retrieved_chunks
        to: sections
        from_columns: [source_doc, section]
        to_columns: [source_doc, section]
        ai_context:
          instructions: A retrieved chunk belongs to the numbered section it cites.
      - name: edge_source
        from: graph_edges
        to: graph_nodes
        from_columns: [source_id]
        to_columns: [node_id]
      - name: edge_target
        from: graph_edges
        to: graph_nodes
        from_columns: [target_id]
        to_columns: [node_id]
    custom_extensions:
      - vendor_name: COMMON
        data: '{"minirag":{"corpus_dir":"Policy","embedding_model":"Alibaba-NLP/gte-modernbert-base","heading":"## N. Title"},"graphify":{"graph":"graph.json","mermaid":"module-level"}}'
