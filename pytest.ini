[pytest]
pythonpath = .
markers =
    llm: requires the real Ollama generator on the host (run by the full CI tier)
# Coverage floor: measured 100% on 2026-10-09 (local run, 186 passed);
# the floor keeps two points of slack for platform-specific lines while
# still enforcing the 98% requirement.
addopts = -m "not llm" --cov=app --cov-report=term-missing --cov-fail-under=98
