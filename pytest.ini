[pytest]
pythonpath = .
markers =
    llm: requires the real Ollama generator on the host (run by the full CI tier)
# Coverage floor: the surviving modules carried 100% before the evaluation
# harness was removed (issue #16). CI is the gate that confirms they still do;
# the floor keeps two points of slack for platform-specific lines while still
# enforcing the 98% requirement.
addopts = -m "not llm" --cov=app --cov-report=term-missing --cov-fail-under=98
