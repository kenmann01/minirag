[pytest]
pythonpath = .
markers =
    llm: requires the real Ollama generator on the host (run by the full CI tier)
# Coverage floor: measured 87% on 2026-10-09 (local run, 97 passed);
# floor is the baseline rounded down to the nearest 5.
addopts = -m "not llm" --cov=app --cov-report=term-missing --cov-fail-under=80
